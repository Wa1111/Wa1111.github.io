<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绚丽烟花秀</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden; /* 隐藏滚动条 */
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
        }
        .tip-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 24px;
            pointer-events: none; /* 让文字不影响点击 */
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="tip-text">点击屏幕绽放烟花</div>
    <canvas id="canvas"></canvas>

<script>
    // 获取canvas环境
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 设置全屏
    let w, h;
    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 烟花粒子数组
    let particles = [];

    // 生成随机颜色的辅助函数
    function randomColor() {
        const r = Math.floor(Math.random() * 255);
        const g = Math.floor(Math.random() * 255);
        const b = Math.floor(Math.random() * 255);
        return `rgb(${r}, ${g}, ${b})`;
    }

    // 粒子类
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            // 爆炸的速度和角度
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2; // 速度范围
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            
            this.alpha = 1; // 透明度
            this.friction = 0.96; // 摩擦力（让烟花慢下来）
            this.gravity = 0.05; // 重力（让烟花下坠）
        }

        update() {
            this.vx *= this.friction;
            this.vy *= this.friction;
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.015; // 慢慢消失
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // 创建爆炸效果
    function createExplosion(x, y) {
        const color = `hsl(${Math.random() * 360}, 100%, 50%)`; // 使用HSL颜色更鲜艳
        for (let i = 0; i < 80; i++) { // 每一个烟花由80个粒子组成
            particles.push(new Particle(x, y, color));
        }
    }

    // 动画循环
    function animate() {
        // 核心技巧：不完全清除画布，而是覆盖一层半透明黑色，形成拖尾效果
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, w, h);

        // 更新和绘制所有粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            p.draw();
            // 如果粒子完全消失，从数组移除
            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }

    // 点击事件
    window.addEventListener('mousedown', (e) => {
        createExplosion(e.clientX, e.clientY);
    });

    // 手机触摸事件
    window.addEventListener('touchstart', (e) => {
        e.preventDefault(); // 防止滚动
        const touch = e.touches[0];
        createExplosion(touch.clientX, touch.clientY);
    }, {passive: false});

    // 自动放烟花（每隔一点时间随机放一个）
    setInterval(() => {
        const x = Math.random() * w;
        const y = Math.random() * h * 0.5; // 只在上半部分放
        createExplosion(x, y);
    }, 800);

    // 启动动画
    animate();

</script>
</body>
</html>
